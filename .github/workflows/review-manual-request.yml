# Copy this file - together with examples/review.yml - into a consuming repo's .github/workflows/.
# It lets anyone ask Arby (rinsed-review-bot) for a review on demand. Works on drafts too, which review.yml
# skips. Same setup as review.yml - the job is the bot's reusable workflow, this file owns the trigger, the
# gate and the concurrency rule; keep both files' `with:` inputs in sync.
#
# To ask for one: press the re-request button next to `rinsed-review-bot` in the PR's Reviewers sidebar.
# Arby lands in that sidebar by reviewing, so for a re-review the button is always already there; if Arby
# has never reviewed the PR (a draft, which review.yml skips), pick it from the sidebar's gear instead.
# Either way it must be Arby the *user* - requesting a team, even @rinsed-org/dev-and-review-bot, does not
# trigger a review. A request that lands always creates a NEW run of this workflow, so if no new run
# appears, it never reached Arby.
#
# Skipped runs here are normal: `review_requested` fires for every reviewer request, so a ruleset that
# auto-requests teams when a PR opens leaves one skipped run per team. Only requests aimed at Arby itself
# run. Re-running a skipped run does nothing - a re-run replays the original event, which still names a
# team, so it skips again every time. Push a commit or re-request Arby instead. This check should not be a
# required check (nor should review.yml's - the one to require is review-dismiss-stale.yml's; see the
# README's "Setup").
name: Review (manual request)

on:
  pull_request_target:
    types: [review_requested]

# Read-only token: the review only reads the PR as data. The only credential that can write is Arby's own
# PAT (org secret RINSED_REVIEW_BOT_TOKEN), and the bot uses it solely to post the review.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # Reported on the PR as "manual-request / Arby Review".
  manual-request:
    # Team requests (like a ruleset's auto-request) have no requested_reviewer, so they skip here too.
    if: github.event.requested_reviewer.login == 'rinsed-review-bot'
    # Shares review.yml's group so a manual review and an automatic one never run at once. No cancelling
    # here: cancelling an in-flight automatic run would kill its check without replacing it (this job
    # reports under a different name), so a manual run queues instead. Job-level so skipped runs stay out
    # of the group.
    concurrency:
      group: arby-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: rinsed-org/review-bot-workflows/.github/workflows/arby-review.yml@v3
    # Every secret the bot needs is an org secret, read inside the reusable workflow. Nothing to list.
    secrets: inherit
    with:
      # --- Optional inputs, shown with their defaults. Keep them identical to review.yml. ---

      # STRONGLY RECOMMENDED. Only these authors get a real verdict (approve / request changes); every
      # other author gets a comment only. A comma/newline list of teams (`org/team-slug`) and/or user
      # logins (e.g. `some-username`). This gate keeps the bot's verdict meaningful - leave it unset and
      # *any* author is eligible. See the README's trust-model note.
      limit-approval-to: rinsed-org/development

      # Set to false to make the bot advisory-only: it comments but never approves / requests changes.
      # approval-enabled: true

      # Severities that block approval (request changes); the rest are posted as advisory comments.
      blocking-severities: P0,P1

      # Review Dependabot PRs too (skipped by default). Normally set as the repo's ARBY_RUN_FOR_DEPENDABOT
      # Actions secret or variable (`true`), which the reusable workflow reads on its own; this input
      # overrides it.
      # run-for-dependabot: "true"

      # Let Codex count production rows in Snowflake (read-only) to check claims about data. Normally set as
      # the repo's ARBY_SNOWFLAKE_ENABLED Actions variable (`true`); this input overrides it.
      # snowflake-enabled: "true"

      # Other repos in this org that Codex may read (read-only, depth 1) to check claims about this repo's
      # consumers and producers. `owner/repo`, `owner/repo@ref`, or `owner/repo:dir,dir` for only those
      # directories (one per line when it has dirs). Read with the Arby Reader app's org secrets; see the
      # README's "Related repositories".
      # related-repos: |
      #   rinsed-org/web
      #   rinsed-org/rinsed-dbt-multiproject:rinsed_macros/macros

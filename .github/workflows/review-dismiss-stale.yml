# Copy this file — together with examples/review.yml and examples/review-manual-request.yml — into a
# consuming repo's .github/workflows/. It dismisses Arby's (rinsed-review-bot) stale approvals as soon as new
# commits are pushed, so a PR never shows an approval for code Arby hasn't seen. Human approvals are left
# alone, and Arby re-reviews the new commits via review.yml on the same event. (GitHub's built-in "dismiss
# stale approvals" setting is all-or-nothing — it can't target a single reviewer — hence this workflow.)
#
# Unlike review.yml, this workflow can safely hold a write token: it consumes no PR-controlled input — just
# the PR number — and runs no PR code. It never touches the review-bot PAT.
#
# Make THIS job the required status check (the ruleset keys on the job name below), not "Arby Review": an
# Arby outage must not block PRs, while this job is cheap and has no Codex dependency. Requiring it
# guarantees a merge can't race a still-pending dismissal after a push. A required check must report on
# every PR — including ones never pushed to after opening — so it runs on the same events as review.yml, not
# just synchronize; on the other events it's normally a no-op that reports green. Add the required check
# only AFTER this file has merged: a pull_request_target workflow doesn't run on the PR that introduces it,
# so requiring the check first would block that PR. See the README's "Setup" and "Stale approvals".
name: Dismiss stale Arby approvals

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  # contents: read is for the runner, not the script: this repo is internal, and the runner downloads the
  # action with the job's token, which has no read access unless it's granted here. Without it the job
  # dies in "Set up job" with "An action could not be found at the URI ...".
  contents: read
  pull-requests: write

jobs:
  dismiss:
    # The required check is keyed on this name — keep it exactly as is, and keep it in sync with the ruleset.
    name: Dismiss stale Arby approvals
    # Rapid pushes: only the newest event's run matters; older in-flight runs carry a stale idea of "stale".
    concurrency:
      group: arby-dismiss-stale-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Two API calls. Without this a hung runner leaves the required check pending for GitHub's 360-minute
    # default instead of going red.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss stale Arby approvals
        uses: rinsed-org/review-bot-workflows/dismiss-stale@v3
        # No secrets: it runs on the job's default token. The only input is the bot's login, which you only
        # need to set if it isn't rinsed-review-bot.
        # with:
        #   review-bot-login: rinsed-review-bot
